plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.plugin.compose"
}

android {
    compileSdk 37
    buildToolsVersion "30.0.3"

    defaultConfig {
        applicationId "com.geckour.random"
        minSdk 28
        targetSdk 37
        versionCode 10
        versionName "1.3.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        vectorDrawables {
            useSupportLibrary true
        }
    }

    signingConfigs {
        release {
            def releaseSettingGradleFile = new File("${project.rootDir}/app/signing/release.gradle")
            apply from: releaseSettingGradleFile, to: android
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_18
        targetCompatibility JavaVersion.VERSION_18
    }
    kotlin {
        compilerOptions {
            freeCompilerArgs.add("-Xopt-in=kotlin.RequiresOptIn")
        }
    }
    buildFeatures {
        compose true
        buildConfig true
    }
    namespace "com.geckour.random"
}

dependencies {
    implementation "androidx.core:core-ktx:1.19.0"
    implementation "androidx.appcompat:appcompat:1.8.0"
    implementation "com.google.android.material:material:1.14.0"

    def composeBom = platform('androidx.compose:compose-bom:2026.08.00')
    implementation composeBom
    androidTestImplementation composeBom
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.material3:material3'

    implementation "androidx.lifecycle:lifecycle-runtime-ktx:2.11.0"
    implementation "androidx.activity:activity-compose:1.13.0"
    implementation 'androidx.compose.ui:ui-tooling-preview'
    debugImplementation 'androidx.compose.ui:ui-tooling'

    testImplementation "junit:junit:4.13.2"
    androidTestImplementation "androidx.test.ext:junit:1.3.0"
    androidTestImplementation "androidx.test.espresso:espresso-core:3.7.0"
    androidTestImplementation "androidx.compose.ui:ui-test-junit4:1.12.0"

    implementation "com.jakewharton.timber:timber:5.0.1"

    implementation "androidx.preference:preference-ktx:1.2.1"

    implementation "io.insert-koin:koin-android:4.2.2"

    implementation "androidx.security:security-crypto:1.1.0"
    implementation "androidx.security:security-identity-credential:1.0.0-alpha03"
}